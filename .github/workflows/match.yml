# Fait jouer un match entre deux commits, sur un runner GitHub.
#
# # Pourquoi ce workflow existe
#
# Le conteneur de session est éphémère : un balayage lancé en tâche de fond y
# est déjà mort à 158 mutants sur 397, sans erreur ni trace, parce que la
# machine avait été mise en veille entre deux tours. **Tant que les matchs ne
# tournent que là, le projet ne peut pas mesurer à cadence longue** — et il a
# donc mesuré ses douze premiers verdicts à `1+0,01`, où le moteur atteint la
# profondeur 8-9 alors qu'il jouera à 17.
#
# Ce n'était pas un arbitrage, c'était une contrainte d'outillage prise pour
# une préférence. Les runners GitHub ne dorment pas et tiennent six heures.
#
# # La réserve, et ce qu'elle vaut réellement
#
# À cadence horloge, une machine plus lente atteint une profondeur plus faible,
# donc **un autre point de fonctionnement** : exactement la variable qu'on
# cherche à contrôler. D'où l'étape `Étalonner`, qui mesure la vitesse du job
# et l'inscrit en tête du résumé.
#
# **Deux corrections successives, le 16 sept. 2026, et la seconde corrige la
# première.** J'avais d'abord annoncé « un runner partagé est deux fois plus
# lent », extrapolé du balayage par mutation — lequel mesure un débit de
# COMPILATION, pas une vitesse de RECHERCHE. J'ai corrigé en « ±10 %, donc ça
# transfère », sur la foi d'UN SEUL runner. C'était caractériser une variance
# à partir d'un point.
#
# Au bench à la profondeur 10, même code moteur :
#
#   conteneur de session, 8 relevés   2 280 655 – 2 396 011 n/s  (étendue 5 %)
#   runner 1000002292                 2 563 044 n/s   (+11 % / conteneur)
#   runner 1000002313                 3 139 691 n/s   (+35 % / conteneur)
#
# Le runner est donc plus RAPIDE que le conteneur, pas plus lent — la réserve
# d'origine avait même le signe faux — et il varie de 22 % d'un runner à
# l'autre, contre 5 % localement.
#
# **Ce que ça coûte, en la seule unité qui compte.** Le projet a mesuré 1,33
# ply par doublement de temps (8× le temps achète +4 plies). De +11 % à +35 %
# de vitesse, cela fait **+0,2 à +0,6 ply** : un verdict rendu ici siège un
# demi-ply plus profond que la même cadence nominale mesurée localement. À
# comparer aux **4 plies** qui ont inversé le verdict de l'élagage par compte
# de coups. Le point de fonctionnement transfère donc en gros, mais avec une
# marge qu'on ne peut plus qualifier de négligeable.
#
# **Un verdict reste valide EN INTERNE quoi qu'il arrive** : les deux moteurs
# partagent le runner, donc sa vitesse ne biaise pas la comparaison. Seule la
# comparaison ENTRE deux runs est menacée — et c'est précisément ce que la
# ligne d'étalonnage permet de vérifier. Elle vient de servir : c'est elle qui
# a démenti le « ±10 % ».
name: Match

on:
  workflow_dispatch:
    inputs:
      candidat:
        description: "Commit, branche ou tag du candidat"
        required: true
        type: string
      reference:
        description: "Commit, branche ou tag de la référence"
        required: true
        type: string
      cadence:
        description: "Cadence fastchess, par exemple 8+0.08 ou 30+0.3"
        required: true
        default: "8+0.08"
        type: string
      parties:
        description: "Nombre de parties. 0 = SPRT avec arrêt anticipé."
        required: true
        default: "0"
        type: string
      elo0:
        description: "Borne basse du SPRT (ignorée si parties > 0)"
        required: false
        default: "0"
        type: string
      elo1:
        description: "Borne haute du SPRT (ignorée si parties > 0)"
        required: false
        default: "5"
        type: string
      graine:
        description: "Graine des ouvertures. La même qu'un match antérieur le rend apparié."
        required: false
        default: "20260913"
        type: string

jobs:
  match:
    name: Match
    runs-on: ubuntu-latest
    # Six heures est le plafond d'un job ; le laisser explicite évite qu'un
    # match long meure sans qu'on sache si c'est lui ou la limite.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version && cargo --version

      # Résoudre AVANT de construire : une référence fausse doit coûter cinq
      # secondes et un message clair, pas vingt secondes et un `fatal:` de git
      # au milieu d'un script.
      #
      # `actions/checkout` ne crée en local QUE la branche par défaut ; les
      # autres n'existent que sous `origin/<nom>`, et `git worktree` ne résout
      # pas le nom nu. Les deux premiers usages réels de ce workflow ont échoué
      # là-dessus — d'abord sur un SHA rendu inatteignable par un squash, puis
      # sur un nom de branche. L'entrée annonce « commit, branche ou tag » ;
      # elle n'avait été éprouvée qu'avec des SHA.
      - name: Résoudre les références
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          resoudre() {
            local ref="$1" quoi="$2" sha
            sha=$(git rev-parse --verify --quiet "${ref}^{commit}" || true)
            [ -n "$sha" ] || sha=$(git rev-parse --verify --quiet "origin/${ref}^{commit}" || true)
            if [ -z "$sha" ]; then
              echo "::error::$quoi introuvable : « $ref » — essayé tel quel et sous origin/." >&2
              exit 1
            fi
            printf '%s' "$sha"
          }
          cand=$(resoudre "${{ inputs.candidat }}"  "candidat")
          base=$(resoudre "${{ inputs.reference }}" "référence")
          echo "candidat  ${{ inputs.candidat }}  -> $cand"
          echo "reference ${{ inputs.reference }} -> $base"
          # Deux références qui pointent le même commit : le match rendrait
          # 0 Elo et personne ne saurait pourquoi. Détecté ici, où c'est
          # gratuit, plutôt qu'après deux compilations.
          if [ "$cand" = "$base" ]; then
            echo "::error::les deux références pointent le même commit ($cand) : il n'y a rien à mesurer" >&2
            exit 1
          fi
          echo "candidat=$cand"  >> "$GITHUB_OUTPUT"
          echo "reference=$base" >> "$GITHUB_OUTPUT"

      # Les deux binaires se construisent en worktree détaché, jamais par
      # `git stash` : le stash emporte tout le travail non committé, outils de
      # mesure compris, et l'on finit par mesurer autre chose que ce qu'on
      # croit. Piège payé le 13 sept. 2026.
      - name: Construire les deux binaires
        shell: bash
        run: |
          set -euo pipefail
          construire() {
            local sha="$1" sortie="$2"
            git worktree add --detach "/tmp/wt-$sortie" "$sha"
            ( cd "/tmp/wt-$sortie" && cargo build --release --bin shallowred )
            cp "/tmp/wt-$sortie/target/release/shallowred" "/tmp/$sortie"
          }
          construire "${{ steps.refs.outputs.candidat }}"  candidat
          construire "${{ steps.refs.outputs.reference }}" reference

          # Deux commits différents peuvent produire le même binaire — une
          # PR qui ne touche que la documentation, par exemple. La garde de
          # l'étape précédente compare les SHA et ne voit pas ce cas ; celle-ci
          # compare ce qui joue réellement.
          a=$(md5sum /tmp/candidat  | cut -d' ' -f1)
          b=$(md5sum /tmp/reference | cut -d' ' -f1)
          echo "candidat  $a"
          echo "reference $b"
          if [ "$a" = "$b" ]; then
            echo "::error::les deux binaires sont identiques bien que les commits diffèrent : il n'y a rien à mesurer"
            exit 1
          fi

      - name: Arbitre
        run: tools/setup-arbiters.sh

      # Le point de fonctionnement effectif dépend de la vitesse du runner. On
      # la mesure à chaque exécution au lieu de la supposer stable — c'est
      # précisément ce qui a permis de découvrir qu'elle l'était.
      - name: Étalonner le runner
        id: etalon
        shell: bash
        run: |
          set -euo pipefail
          sortie=$(/tmp/reference bench 10)
          echo "$sortie"
          nps=$(echo "$sortie" | awk '/Nodes\/second/ {print $NF}')
          # Le `sleep` n'est pas décoratif : sans lui, stdin se ferme dès que
          # `printf` a fini, le moteur lit EOF et INTERROMPT sa recherche. La
          # sonde rendait alors 4 au lieu de 10 — un chiffre faux et plausible,
          # le pire genre. C'est le piège consigné le 13 sept. 2026, que j'ai
          # rediagnostiqué le matin du 16 puis réintroduit ici le même jour.
          prof=$( { printf 'uci\nisready\nposition startpos\ngo movetime 250\n'
                    sleep 3
                    printf 'quit\n'; } \
                  | timeout 60 /tmp/reference 2>/dev/null \
                  | awk '/^info depth/ {d=$3} END {print d+0}')
          echo "nps=$nps"            >> "$GITHUB_OUTPUT"
          echo "profondeur=$prof"    >> "$GITHUB_OUTPUT"
          echo "coeurs=$(nproc)"     >> "$GITHUB_OUTPUT"

      - name: Jouer
        id: jouer
        shell: bash
        run: |
          # `bash -e` n'active PAS pipefail : sans lui, le code de retour serait
          # celui de `tee` et un match échoué passerait pour un succès. Faute
          # déjà commise sur le verdict de mutation le 15 sept. 2026.
          set -euo pipefail
          concurrence=$(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
          commun=(
            -engine cmd=/tmp/candidat  name=candidat
            -engine cmd=/tmp/reference name=reference
            -each tc="${{ inputs.cadence }}" proto=uci
            -openings file=tools/book.epd format=epd order=random
            -srand "${{ inputs.graine }}"
            -games 2 -repeat
            -concurrency "$concurrence"
            -draw movenumber=40 movecount=8 score=10
            -resign movecount=4 score=600 twosided=true
          )
          if [ "${{ inputs.parties }}" -gt 0 ]; then
            # Longueur fixe : rend une estimation d'Elo utilisable. Un SPRT
            # s'arrête dès qu'il a tranché et rend alors une estimation trop
            # grossière pour comparer deux points de fonctionnement.
            rondes=$(( (${{ inputs.parties }} + 1) / 2 ))
            tools/arbiters/fastchess "${commun[@]}" -rounds "$rondes" \
              | tee /tmp/match.log
          else
            # LE PLAFOND DU SPRT NE DOIT PAS FAIRE CROIRE À UN RUN À 2 %.
            #
            # Il valait `-rounds 20000` en dur, et fastchess imprime alors
            # « Started game 688 of 40000 » — ce qui fait ressembler un run
            # SAIN à un run à 2 %. **Cette ligne a induit la même erreur de
            # lecture deux fois le 22 sept. 2026**, dont une sur un run qui
            # venait précisément d'expirer : impossible de distinguer à l'œil
            # « il reste du chemin » de « il n'ira jamais au bout ».
            #
            # CE QUI EST RÉPARÉ, ET CE QUI NE L'EST PAS. Le plafond passe
            # d'un 20 000 arbitraire à une valeur du bon ordre de grandeur, et
            # une notice dit ce que le job peut réellement atteindre. Ce que je
            # n'ai PAS fait : caler le plafond sur l'estimation exacte. Elle
            # est conservatrice de 15 % (7,47 s/partie prédites contre 6,45
            # mesurées à 8+0,08 — le moteur ne dépense pas toute sa pendule),
            # donc un plafond serré TRONQUERAIT des parties que le job aurait
            # pu jouer. **Un dommage statistique réel pour réparer un problème
            # d'affichage est un mauvais échange** : le facteur 1,5 garantit
            # que c'est l'horloge du job qui décide, jamais ce nombre.
            #
            # POURQUOI L'ESTIMATION N'EST PAS CALIBRÉE, alors qu'on a deux
            # points pour le faire. Les matchs réels donnent 5,62 s/partie à
            # 8+0,08 (3738 parties) et 21,9 s à 30+0,3 (960 parties), soit un
            # facteur 0,77 contre la formule — stable sur les deux. Tentant de
            # le baker. **Mais ce facteur EST le gaspillage de pendule** : si
            # le moteur laisse 48 % de son horloge, ses parties finissent plus
            # vite que la cadence nominale. C21 corrige exactement cela, donc
            # la constante dériverait vers 1 le jour où il fusionne. *Une
            # constante qu'un chantier en cours invalide ne s'écrit pas* —
            # même famille que le chiffre de référence qui vieillit en prose,
            # sauf qu'ici on connaît d'avance ce qui va le périmer.
            base=$(echo "${{ inputs.cadence }}" | cut -d+ -f1)
            inc=$(echo "${{ inputs.cadence }}"  | cut -d+ -f2)
            par_partie=$(awk -v b="$base" -v i="$inc" -v c="$concurrence" \
              'BEGIN { printf "%.3f", 2 * (b + 40 * i) / c }')
            tient=$(awk -v s="$par_partie" 'BEGIN { printf "%d", 350 * 60 / s }')
            plafond=$(( tient * 3 / 2 ))
            echo "::notice::Ce job atteint au moins ~$tient parties à ${{ inputs.cadence }}" \
                 "(estimation CONSERVATRICE de ~$par_partie s/partie, plafond de 350 min :" \
                 "les deux matchs historiques ont fait 25 % de plus). Le SPRT s'arrêtera" \
                 "avant s'il tranche ; ce nombre n'est PAS une cible."
            tools/arbiters/fastchess "${commun[@]}" -rounds $(( (plafond + 1) / 2 )) \
              -sprt elo0="${{ inputs.elo0 }}" elo1="${{ inputs.elo1 }}" \
                    alpha=0.05 beta=0.05 model=normalized \
              | tee /tmp/match.log
          fi

      # Le résumé va dans l'onglet Actions et non dans le journal : le verdict
      # du balayage par mutation avait été imprimé AVANT trois cents lignes de
      # détail, et son seul lecteur ne pouvait pas l'atteindre. Un rapport
      # qu'on ne peut pas lire ne rapporte rien.
      - name: Résumé
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Match — ${{ inputs.cadence }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| candidat | \`${{ inputs.candidat }}\` → \`${{ steps.refs.outputs.candidat }}\` |"
            echo "| référence | \`${{ inputs.reference }}\` → \`${{ steps.refs.outputs.reference }}\` |"
            echo "| cadence | \`${{ inputs.cadence }}\` |"
            echo "| graine des ouvertures | \`${{ inputs.graine }}\` |"
            echo "| cœurs du runner | ${{ steps.etalon.outputs.coeurs }} |"
            echo "| **nœuds/s au bench** | **${{ steps.etalon.outputs.nps }}** |"
            echo "| profondeur en 250 ms | ${{ steps.etalon.outputs.profondeur }} |"
            echo
            echo "> **La profondeur ci-dessus est le point de fonctionnement"
            echo "> réel de ce run** — les nœuds/s n'en sont qu'un indice. Deux"
            echo "> runners mesurés le 16 sept. 2026 rendaient 2 563 044 et"
            echo "> 3 139 691 n/s sur le même binaire, soit 22 % d'écart, quand"
            echo "> le conteneur de session ne varie que de 5 %. Traduit en"
            echo "> profondeur (1,33 ply par doublement de temps), cela vaut"
            echo "> environ un demi-ply."
            echo ">"
            echo "> Ce verdict est valide **en interne** quoi qu'il arrive : les"
            echo "> deux moteurs ont partagé cette machine. **Comparer ces deux"
            echo "> lignes avant de comparer ce verdict à un autre run** — c'est"
            echo "> la raison d'être de cette ligne, pas une formalité."
            echo
            echo '### Verdict'
            echo
            echo '```'
            # La dernière ligne de résultats, jamais la première : les arbitres
            # impriment un score courant après CHAQUE partie.
            grep -E "^(Elo|LOS|Games|Ptnml|LLR|SPRT|Results)" /tmp/match.log \
              | tail -14 || echo "aucun résultat lisible — voir le journal"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-log
          path: /tmp/match.log
          retention-days: 30
