# Fait jouer un match entre deux commits, sur un runner GitHub.
#
# # Pourquoi ce workflow existe
#
# Le conteneur de session est éphémère : un balayage lancé en tâche de fond y
# est déjà mort à 158 mutants sur 397, sans erreur ni trace, parce que la
# machine avait été mise en veille entre deux tours. **Tant que les matchs ne
# tournent que là, le projet ne peut pas mesurer à cadence longue** — et il a
# donc mesuré ses douze premiers verdicts à `1+0,01`, où le moteur atteint la
# profondeur 8-9 alors qu'il jouera à 17.
#
# Ce n'était pas un arbitrage, c'était une contrainte d'outillage prise pour
# une préférence. Les runners GitHub ne dorment pas et tiennent six heures.
#
# # La réserve, et ce qu'elle vaut réellement
#
# À cadence horloge, une machine plus lente atteint une profondeur plus faible,
# donc **un autre point de fonctionnement** : exactement la variable qu'on
# cherche à contrôler. D'où l'étape `Étalonner`, qui mesure la vitesse du job
# et l'inscrit en tête du résumé.
#
# **Deux corrections successives, le 16 sept. 2026, et la seconde corrige la
# première.** J'avais d'abord annoncé « un runner partagé est deux fois plus
# lent », extrapolé du balayage par mutation — lequel mesure un débit de
# COMPILATION, pas une vitesse de RECHERCHE. J'ai corrigé en « ±10 %, donc ça
# transfère », sur la foi d'UN SEUL runner. C'était caractériser une variance
# à partir d'un point.
#
# Au bench à la profondeur 10, même code moteur :
#
#   conteneur de session, 8 relevés   2 280 655 – 2 396 011 n/s  (étendue 5 %)
#   runner 1000002292                 2 563 044 n/s   (+11 % / conteneur)
#   runner 1000002313                 3 139 691 n/s   (+35 % / conteneur)
#
# Le runner est donc plus RAPIDE que le conteneur, pas plus lent — la réserve
# d'origine avait même le signe faux — et il varie de 22 % d'un runner à
# l'autre, contre 5 % localement.
#
# **Ce que ça coûte, en la seule unité qui compte.** Le projet a mesuré 1,36
# ply par doublement de temps (8× le temps achète +4 plies). De +11 % à +35 %
# de vitesse, cela fait **+0,2 à +0,6 ply** : un verdict rendu ici siège un
# demi-ply plus profond que la même cadence nominale mesurée localement. À
# comparer aux **4 plies** qui ont inversé le verdict de l'élagage par compte
# de coups. Le point de fonctionnement transfère donc en gros, mais avec une
# marge qu'on ne peut plus qualifier de négligeable.
#
# **Un verdict reste valide EN INTERNE quoi qu'il arrive** : les deux moteurs
# partagent le runner, donc sa vitesse ne biaise pas la comparaison. Seule la
# comparaison ENTRE deux runs est menacée — et c'est précisément ce que la
# ligne d'étalonnage permet de vérifier. Elle vient de servir : c'est elle qui
# a démenti le « ±10 % ».
name: Match

on:
  workflow_dispatch:
    inputs:
      candidat:
        description: "Commit, branche ou tag du candidat"
        required: true
        type: string
      reference:
        description: "Commit, branche ou tag de la référence"
        required: true
        type: string
      cadence:
        description: "Cadence de la référence — et du candidat si « cadence_candidat » est vide. Par exemple 8+0.08 ou 30+0.3 ; à coups comptés, 40/8 — quarante coups en huit secondes, renouvelés."
        required: true
        default: "8+0.08"
        type: string
      parties:
        description: "Nombre de parties. 0 = SPRT avec arrêt anticipé."
        required: true
        default: "0"
        type: string
      elo0:
        description: "Borne basse du SPRT (ignorée si parties > 0)"
        required: false
        default: "0"
        type: string
      elo1:
        description: "Borne haute du SPRT (ignorée si parties > 0)"
        required: false
        default: "5"
        type: string
      graine:
        description: "Graine des ouvertures. La même qu'un match antérieur le rend apparié ; « auto » en tire une propre au run, à utiliser dès qu'on compte mettre plusieurs matchs en commun."
        required: false
        default: "20260913"
        type: string
      ponder:
        description: "Qui pondère. « candidat » admet le même commit des deux côtés : c'est la mesure du ponder lui-même. Autre que « non » : arbitre cutechess, concurrence déduite des cœurs, longueur fixe seulement."
        required: false
        default: "non"
        type: choice
        options:
          - "non"
          - "candidat"
          - "les-deux"
      cadence_candidat:
        description: "Cadence du SEUL candidat, pour un match à handicap de temps (calibrer l'Elo par pli). Vide : celle de « cadence », qui est toujours celle de la référence. Différente : le même commit des deux côtés est admis."
        required: false
        default: ""
        type: string
      sonde:
        description: "« oui » : cutechess avec -debug all, UNE partie à la fois, et tools/plis.sh dans le résumé — plis et n/s de chaque camp, appariés par partie. Mesure des plis, pas de l'Elo : quelques dizaines de parties suffisent. Admet le même commit des deux côtés (témoin)."
        required: false
        default: "non"
        type: choice
        options:
          - "non"
          - "oui"
      fils_candidat:
        description: "Fils de recherche du candidat (option UCI Threads). Au-delà de 1 : le moteur doit déclarer l'option, pas plus de fils que de cœurs PHYSIQUES, et la concurrence se déduit des fils — une partie à la fois dès 2 fils sur un runner à 4 processeurs logiques."
        required: false
        default: "1"
        type: string
      fils_reference:
        description: "Fils de recherche de la référence. Des fils différents admettent le même commit des deux côtés : c'est la mesure de Lazy SMP elle-même."
        required: false
        default: "1"
        type: string

jobs:
  match:
    name: Match
    runs-on: ubuntu-latest
    # Six heures est le plafond d'un job ; le laisser explicite évite qu'un
    # match long meure sans qu'on sache si c'est lui ou la limite.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version && cargo --version

      # Résoudre AVANT de construire : une référence fausse doit coûter cinq
      # secondes et un message clair, pas vingt secondes et un `fatal:` de git
      # au milieu d'un script.
      #
      # `actions/checkout` ne crée en local QUE la branche par défaut ; les
      # autres n'existent que sous `origin/<nom>`, et `git worktree` ne résout
      # pas le nom nu. Les deux premiers usages réels de ce workflow ont échoué
      # là-dessus — d'abord sur un SHA rendu inatteignable par un squash, puis
      # sur un nom de branche. L'entrée annonce « commit, branche ou tag » ;
      # elle n'avait été éprouvée qu'avec des SHA.
      - name: Résoudre les références
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          resoudre() {
            local ref="$1" quoi="$2" sha
            sha=$(git rev-parse --verify --quiet "${ref}^{commit}" || true)
            [ -n "$sha" ] || sha=$(git rev-parse --verify --quiet "origin/${ref}^{commit}" || true)
            if [ -z "$sha" ]; then
              echo "::error::$quoi introuvable : « $ref » — essayé tel quel et sous origin/." >&2
              exit 1
            fi
            printf '%s' "$sha"
          }
          cand=$(resoudre "${{ inputs.candidat }}"  "candidat")
          base=$(resoudre "${{ inputs.reference }}" "référence")
          echo "candidat  ${{ inputs.candidat }}  -> $cand"
          echo "reference ${{ inputs.reference }} -> $base"

          # UNE CADENCE PAR MOTEUR. `cadence` est celle de la référence, et
          # du candidat quand `cadence_candidat` est vide. Les deux arbitres
          # prennent un `tc=` par moteur — mais un `tc=` dans `-each` ÉCRASE
          # ceux des moteurs, vérifié sur les deux le 23 sept. 2026 : le
          # candidat recevait `wtime 1010` au lieu de 2020. L'étape « Jouer »
          # ne le met donc jamais dans `-each`.
          tc_ref="${{ inputs.cadence }}"
          tc_cand="${{ inputs.cadence_candidat }}"
          [ -n "$tc_cand" ] || tc_cand="$tc_ref"

          # LES FILS DE RECHERCHE, un nombre par moteur — l'option UCI
          # `Threads`. Validés ici, où une faute de frappe coûte cinq
          # secondes : « 2 » tapé « 2 fils » ferait sinon échouer l'étape qui
          # joue, après deux compilations.
          fils_cand="${{ inputs.fils_candidat }}"
          fils_ref="${{ inputs.fils_reference }}"
          for f in "$fils_cand" "$fils_ref"; do
            if ! [[ "$f" =~ ^[1-9][0-9]?$ ]]; then
              echo "::error::nombre de fils illisible : « $f » — un entier de 1 à 99." >&2
              exit 1
            fi
          done

          # cutechess joue le ponder, que fastchess ignore, et la sonde, dont
          # `tools/plis.sh` lit le format `-debug all`. fastchess tout le reste.
          if [ "${{ inputs.ponder }}" != "non" ] || [ "${{ inputs.sonde }}" = "oui" ]; then
            arbitre=cutechess
          else
            arbitre=fastchess
          fi

          # Deux références qui pointent le même commit : le match rendrait
          # 0 Elo et personne ne saurait pourquoi. Détecté ici, où c'est
          # gratuit, plutôt qu'après deux compilations.
          #
          # SAUF quand quelque chose d'autre que le binaire les distingue :
          # le seul candidat pondère (la mesure du ponder lui-même), il a une
          # autre pendule (le handicap de temps qui calibre l'Elo par pli),
          # d'autres fils (la mesure de Lazy SMP elle-même), ou c'est une
          # sonde, dont le témoin est justement le même binaire.
          meme_binaire_admis=non
          if [ "${{ inputs.ponder }}" = "candidat" ] || [ "$tc_cand" != "$tc_ref" ] \
             || [ "$fils_cand" != "$fils_ref" ] || [ "${{ inputs.sonde }}" = "oui" ]; then
            meme_binaire_admis=oui
          fi
          if [ "$cand" = "$base" ] && [ "$meme_binaire_admis" = "non" ]; then
            echo "::error::les deux références pointent le même commit ($cand) : il n'y a rien à mesurer" >&2
            exit 1
          fi
          echo "candidat=$cand"  >> "$GITHUB_OUTPUT"
          echo "reference=$base" >> "$GITHUB_OUTPUT"
          echo "tc_cand=$tc_cand" >> "$GITHUB_OUTPUT"
          echo "tc_ref=$tc_ref"   >> "$GITHUB_OUTPUT"
          echo "arbitre=$arbitre" >> "$GITHUB_OUTPUT"
          echo "meme_binaire_admis=$meme_binaire_admis" >> "$GITHUB_OUTPUT"
          echo "fils_cand=$fils_cand" >> "$GITHUB_OUTPUT"
          echo "fils_ref=$fils_ref"   >> "$GITHUB_OUTPUT"

          # La graine est une CONDITION DE VALIDITÉ, dans les DEUX sens, et
          # c'est pourquoi elle se résout ici plutôt que dans l'étape qui joue.
          #
          # Le moteur est déterministe : mêmes binaires plus même graine
          # donnent les mêmes parties, coup pour coup. Garder la graine par
          # défaut rend deux matchs APPARIÉS — c'est ce qui a permis de
          # comparer une même technique à deux cadences, et il ne faut pas le
          # perdre. Mais deux matchs à longueur fixe qu'on veut METTRE EN
          # COMMUN doivent être INDÉPENDANTS : à graine égale, l'effectif
          # double sur le papier sans que l'information bouge.
          #
          # « auto » tire une graine propre au run. Elle est imprimée dans le
          # résumé comme les autres, donc le match reste rejouable à
          # l'identique en la repassant telle quelle.
          #
          # Elle passe par GITHUB_OUTPUT et non par une variable de shell : le
          # résumé est une AUTRE étape, et une variable de shell ne la
          # traverse pas — elle y serait simplement vide.
          graine="${{ inputs.graine }}"
          if [ "$graine" = "auto" ]; then
            graine="${{ github.run_id }}"
            echo "::notice::graine tirée du run : $graine — la repasser telle quelle rejoue ce match à l'identique"
          fi
          # cutechess lit sa graine sur 32 bits non signés (`-srand`,
          # `QMetaType::UInt`), et un identifiant de run en compte 35. Il la
          # réduit modulo 2³² SANS LE DIRE — mesuré le 23 sept. 2026 :
          # 35861838168 et 1502099800 y jouent les mêmes ouvertures. Réduite
          # ICI, pour que la graine imprimée soit celle qui a joué.
          if [ "$arbitre" = "cutechess" ]; then
            graine=$(( graine % 4294967296 ))
          fi
          echo "graine=$graine" >> "$GITHUB_OUTPUT"

      # Les deux binaires se construisent en worktree détaché, jamais par
      # `git stash` : le stash emporte tout le travail non committé, outils de
      # mesure compris, et l'on finit par mesurer autre chose que ce qu'on
      # croit. Piège payé le 13 sept. 2026.
      - name: Construire les deux binaires
        shell: bash
        run: |
          set -euo pipefail
          construire() {
            local sha="$1" sortie="$2"
            git worktree add --detach "/tmp/wt-$sortie" "$sha"
            ( cd "/tmp/wt-$sortie" && cargo build --release --bin shallowred )
            cp "/tmp/wt-$sortie/target/release/shallowred" "/tmp/$sortie"
          }
          construire "${{ steps.refs.outputs.candidat }}"  candidat
          construire "${{ steps.refs.outputs.reference }}" reference

          # Deux commits différents peuvent produire le même binaire — une
          # PR qui ne touche que la documentation, par exemple. La garde de
          # l'étape précédente compare les SHA et ne voit pas ce cas ; celle-ci
          # compare ce qui joue réellement.
          a=$(md5sum /tmp/candidat  | cut -d' ' -f1)
          b=$(md5sum /tmp/reference | cut -d' ' -f1)
          echo "candidat  $a"
          echo "reference $b"
          if [ "$a" = "$b" ] && [ "${{ steps.refs.outputs.meme_binaire_admis }}" != "oui" ]; then
            echo "::error::les deux binaires sont identiques bien que les commits diffèrent : il n'y a rien à mesurer"
            exit 1
          fi

      # UN MOTEUR IGNORE EN SILENCE UNE OPTION QU'IL NE CONNAÎT PAS — le
      # protocole l'exige, et ce moteur le fait. Un match « deux fils contre
      # un » lancé sur un binaire d'avant Lazy SMP jouerait donc monofil des
      # deux côtés et rendrait zéro, lisible comme un verdict. D'où ce
      # contrôle : au-delà d'un fil, le binaire doit DÉCLARER `Threads` en
      # réponse à `uci`, ou le job s'arrête ici.
      - name: Les moteurs déclarent-ils leurs fils ?
        shell: bash
        run: |
          set -euo pipefail
          verifier() {
            local camp="$1" nom="$2" fils="$3"
            [ "$fils" -gt 1 ] || return 0
            if ! printf 'uci\nquit\n' | timeout 10 "/tmp/$camp" | grep -q '^option name Threads '; then
              echo "::error::$fils fils demandés $nom, qui ne déclare pas l'option Threads : le moteur jouerait monofil sans le dire." >&2
              exit 1
            fi
            echo "$camp : déclare Threads, $fils fils"
          }
          verifier candidat  "au candidat"     "${{ steps.refs.outputs.fils_cand }}"
          verifier reference "à la référence" "${{ steps.refs.outputs.fils_ref }}"

      # fastchess ne sait pas pondérer : pas une occurrence du mot dans son
      # arbre au commit épinglé, établi par un `grep` avec témoin et non par
      # son README. cutechess-cli, si — `ponder` par moteur, dans son
      # `help.txt`. D'où deux arbitres selon qui pondère.
      - name: Arbitre
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.refs.outputs.arbitre }}" = "fastchess" ]; then
            tools/setup-arbiters.sh
          else
            tools/setup-arbiters.sh --with-cutechess
          fi

      # Le point de fonctionnement effectif dépend de la vitesse du runner. On
      # la mesure à chaque exécution au lieu de la supposer stable — c'est
      # précisément ce qui a permis de découvrir qu'elle l'était.
      - name: Étalonner le runner
        id: etalon
        shell: bash
        run: |
          set -euo pipefail
          sortie=$(/tmp/reference bench 10)
          echo "$sortie"
          nps=$(echo "$sortie" | awk '/Nodes\/second/ {print $NF}')
          # Le `sleep` n'est pas décoratif : sans lui, stdin se ferme dès que
          # `printf` a fini, le moteur lit EOF et INTERROMPT sa recherche. La
          # sonde rendait alors 4 au lieu de 10 — un chiffre faux et plausible,
          # le pire genre. C'est le piège consigné le 13 sept. 2026, que j'ai
          # rediagnostiqué le matin du 16 puis réintroduit ici le même jour.
          prof=$( { printf 'uci\nisready\nposition startpos\ngo movetime 250\n'
                    sleep 3
                    printf 'quit\n'; } \
                  | timeout 60 /tmp/reference 2>/dev/null \
                  | awk '/^info depth/ {d=$3} END {print d+0}')
          echo "nps=$nps"            >> "$GITHUB_OUTPUT"
          echo "profondeur=$prof"    >> "$GITHUB_OUTPUT"
          echo "coeurs=$(nproc)"     >> "$GITHUB_OUTPUT"

          # LA TOPOLOGIE, parce que « quatre cœurs » peut vouloir dire deux
          # cœurs physiques à deux fils chacun. Le conteneur de session en a
          # quatre sans SMT ; les runners n'avaient jamais été regardés. Or le
          # ponder et Lazy SMP font réfléchir plusieurs fils à la fois, et deux
          # fils d'un même cœur physique s'en partagent les unités de calcul.
          lscpu
          fils=$(lscpu | awk -F: '/^Thread\(s\) per core/ {gsub(/ /, "", $2); print $2}')
          physiques=$(lscpu -p=CORE,SOCKET | grep -v '^#' | sort -u | wc -l)
          modele=$(lscpu | awk -F: '/^Model name/ {sub(/^ +/, "", $2); print $2; exit}')
          echo "topologie=$(nproc) processeurs logiques, $physiques cœurs physiques, $fils fil(s) par cœur — $modele" >> "$GITHUB_OUTPUT"
          echo "physiques=$physiques" >> "$GITHUB_OUTPUT"

      - name: Jouer
        id: jouer
        shell: bash
        run: |
          # `bash -e` n'active PAS pipefail : sans lui, le code de retour serait
          # celui de `tee` et un match échoué passerait pour un succès. Faute
          # déjà commise sur le verdict de mutation le 15 sept. 2026.
          set -euo pipefail

          # LA CONCURRENCE SE DÉDUIT DES CŒURS QU'OCCUPE UNE PARTIE :
          #
          #   cœurs occupés par une partie × concurrence ≤ cœurs − 1
          #
          # le cœur restant étant celui de l'arbitre. Monofil sans ponder, un
          # seul moteur réfléchit à la fois : un cœur par partie. Un camp qui
          # pondère réfléchit PENDANT que l'autre joue : deux. Au-delà, les
          # parties se volent du CPU, et le vol va du camp qui pondère vers
          # son adversaire — donc VERS l'hypothèse. Refuser vaut mieux qu'un
          # verdict biaisé dans le sens de ce qu'on espère. Voir « La
          # concurrence d'un match se DÉDUIT des cœurs qu'occupe une partie »
          # dans tools/README.md.
          #
          # AVEC DES FILS, un moteur qui réfléchit occupe autant de cœurs que
          # de fils : sans ponder, le plus gros des deux camps ; avec ponder,
          # les deux camps réfléchissent en même temps, donc leur somme.
          fils_cand="${{ steps.refs.outputs.fils_cand }}"
          fils_ref="${{ steps.refs.outputs.fils_ref }}"
          fils_max=$(( fils_cand > fils_ref ? fils_cand : fils_ref ))
          if [ "${{ inputs.ponder }}" = "non" ]; then
            par_partie=$fils_max
          else
            par_partie=$(( fils_cand + fils_ref ))
          fi
          # Et, DANS une partie, pas plus de fils qui réfléchissent à la fois
          # que de cœurs PHYSIQUES. Les runners ont quatre processeurs
          # logiques pour deux cœurs (SMT, mesuré le 23 sept. 2026) : deux
          # fils d'un même cœur s'en partagent les unités de calcul, et la
          # mesure dirait ce que vaut le SMT, pas ce que vaut la technique.
          # Entre deux parties, le partage frappe les deux camps pareil — c'est
          # pourquoi la concurrence 3 des matchs monofils reste valide en
          # interne. Dans une partie, il frappe le camp qui a le plus de fils.
          physiques="${{ steps.etalon.outputs.physiques }}"
          if [ "$par_partie" -gt "$physiques" ]; then
            echo "::error::une partie fait réfléchir $par_partie fils à la fois pour $physiques cœur(s) physique(s) : des fils partageraient un cœur." >&2
            exit 1
          fi
          concurrence=$(( ($(nproc) - 1) / par_partie ))
          if [ "$concurrence" -lt 1 ]; then
            echo "::error::$(nproc) cœur(s) pour des parties qui en occupent $par_partie chacune : l'inégalité ne tient pas." >&2
            exit 1
          fi
          # La sonde joue UNE partie à la fois : `tools/plis.sh` apparie les
          # deux camps par le numéro de partie, qu'il compte aux `ucinewgame`,
          # et des parties entrelacées mêleraient les numéros.
          if [ "${{ inputs.sonde }}" = "oui" ]; then concurrence=1; fi
          echo "concurrence=$concurrence" >> "$GITHUB_OUTPUT"
          echo "debut=$(date +%s)"        >> "$GITHUB_OUTPUT"

          tc_cand="${{ steps.refs.outputs.tc_cand }}"
          tc_ref="${{ steps.refs.outputs.tc_ref }}"
          # Durée d'une partie par la formule conservatrice du projet : chaque
          # camp dépense au plus sa base plus quarante incréments, chacun SA
          # pendule — elles diffèrent dans un match à handicap de temps.
          #
          # Une cadence À COUPS COMPTÉS, « N/T+I » — N coups en T secondes,
          # renouvelés —, rend T à chaque contrôle : quarante coups par camp en
          # traversent 40 / N quand N < 40, un seul sinon. L'ancienne lecture
          # découpait sur « + » seul et prenait « 40/8 » pour quarante secondes,
          # cinq fois trop (C26, 24 sept. 2026). Éprouvée sur les formes
          # existantes : 8+0.08 rend toujours 7,467 s à trois parties à la fois.
          s_partie=$(awk -v a="$tc_cand" -v b="$tc_ref" -v c="$concurrence" '
            function camp(tc,   m, p, n, t) {
              n = 0
              if (split(tc, m, "/") == 2) { n = m[1] + 0; tc = m[2] }
              split(tc, p, "+"); t = p[1] + 0
              if (n > 0 && n < 40) t = t * 40 / n
              return t + 40 * (p[2] + 0)
            }
            BEGIN { printf "%.3f", (camp(a) + camp(b)) / c }')
          tient=$(awk -v s="$s_partie" 'BEGIN { printf "%d", 350 * 60 / s }')

          if [ "${{ steps.refs.outputs.arbitre }}" = "cutechess" ]; then
            # LONGUEUR FIXE SEULEMENT. Le SPRT de cutechess n'a pas le modèle
            # de celui de fastchess (`model=normalized`), et deux verdicts
            # séquentiels de modèles différents ne se comparent pas. Surtout,
            # à une partie à la fois, un job ne joue que ~1 000 parties à
            # `8+0,08` : la mesure passe de toute façon par plusieurs jobs à
            # graine « auto », mis en commun par `tools/mettre-en-commun.sh`
            # — et cutechess n'imprimant pas le vecteur pentanomial,
            # `tools/paires.sh` le reconstruit dans le résumé.
            if [ "${{ inputs.parties }}" -le 0 ]; then
              echo "::error::pas de SPRT sous cutechess (ponder ou sonde) : passer un nombre de parties, et lancer plusieurs jobs à graine « auto »." >&2
              exit 1
            fi
            ponder_cand=(); ponder_ref=()
            if [ "${{ inputs.ponder }}" != "non" ]; then ponder_cand=(ponder); fi
            fils_c=(); fils_r=()
            if [ "$fils_cand" -gt 1 ]; then fils_c=("option.Threads=$fils_cand"); fi
            if [ "$fils_ref" -gt 1 ]; then fils_r=("option.Threads=$fils_ref"); fi
            if [ "${{ inputs.ponder }}" = "les-deux" ]; then ponder_ref=(ponder); fi
            # `-debug all` imprime TOUT le dialogue UCI — ~0,5 Mo par partie à
            # `8+0,08`. Il va dans le fichier, que lit `tools/plis.sh` ; le
            # journal du job n'en reçoit que ce qui n'est pas du dialogue.
            debug=()
            if [ "${{ inputs.sonde }}" = "oui" ]; then debug=(-debug all); fi
            rondes=$(( (${{ inputs.parties }} + 1) / 2 ))
            if [ "${{ inputs.parties }}" -gt "$tient" ]; then
              echo "::warning::${{ inputs.parties }} parties demandées, ce job en tient au moins ~$tient" \
                   "à $s_partie s par partie et $concurrence partie(s) à la fois (estimation" \
                   "conservatrice). Tronqué, un match à longueur fixe reste non biaisé — mais" \
                   "plus court que prévu."
            fi
            QT_QPA_PLATFORM=offscreen tools/arbiters/cutechess-cli "${debug[@]}" \
              -engine cmd=/tmp/candidat  name=candidat  proto=uci tc="$tc_cand" "${ponder_cand[@]}" "${fils_c[@]}" \
              -engine cmd=/tmp/reference name=reference proto=uci tc="$tc_ref"  "${ponder_ref[@]}" "${fils_r[@]}" \
              -openings file=tools/book.epd format=epd order=random \
              -srand "${{ steps.refs.outputs.graine }}" \
              -games 2 -repeat -rounds "$rondes" \
              -concurrency "$concurrence" \
              -draw movenumber=40 movecount=8 score=10 \
              -resign movecount=4 score=600 twosided=true \
              | tee /tmp/match.log | grep --line-buffered -vE '^[0-9]+ [<>]'
            exit 0
          fi

          # `option.Threads` par moteur, jamais dans `-each` : comme `tc=`,
          # une clé de `-each` écrase celles des moteurs.
          fils_c=(); fils_r=()
          if [ "$fils_cand" -gt 1 ]; then fils_c=("option.Threads=$fils_cand"); fi
          if [ "$fils_ref" -gt 1 ]; then fils_r=("option.Threads=$fils_ref"); fi
          commun=(
            -engine cmd=/tmp/candidat  name=candidat  tc="$tc_cand" "${fils_c[@]}"
            -engine cmd=/tmp/reference name=reference tc="$tc_ref"  "${fils_r[@]}"
            -each proto=uci
            -openings file=tools/book.epd format=epd order=random
            -srand "${{ steps.refs.outputs.graine }}"
            -games 2 -repeat
            -concurrency "$concurrence"
            -draw movenumber=40 movecount=8 score=10
            -resign movecount=4 score=600 twosided=true
          )
          if [ "${{ inputs.parties }}" -gt 0 ]; then
            # Longueur fixe : rend une estimation d'Elo utilisable. Un SPRT
            # s'arrête dès qu'il a tranché et rend alors une estimation trop
            # grossière pour comparer deux points de fonctionnement.
            rondes=$(( (${{ inputs.parties }} + 1) / 2 ))
            tools/arbiters/fastchess "${commun[@]}" -rounds "$rondes" \
              | tee /tmp/match.log
          else
            # LE PLAFOND DU SPRT NE DOIT PAS FAIRE CROIRE À UN RUN À 2 %.
            #
            # Il valait `-rounds 20000` en dur, et fastchess imprime alors
            # « Started game 688 of 40000 » — ce qui fait ressembler un run
            # SAIN à un run à 2 %. **Cette ligne a induit la même erreur de
            # lecture deux fois le 22 sept. 2026**, dont une sur un run qui
            # venait précisément d'expirer : impossible de distinguer à l'œil
            # « il reste du chemin » de « il n'ira jamais au bout ».
            #
            # CE QUI EST RÉPARÉ, ET CE QUI NE L'EST PAS. Le plafond passe
            # d'un 20 000 arbitraire à une valeur du bon ordre de grandeur, et
            # une notice dit ce que le job peut réellement atteindre. Ce que je
            # n'ai PAS fait : caler le plafond sur l'estimation exacte. Elle
            # est conservatrice de 15 % (7,47 s/partie prédites contre 6,45
            # mesurées à 8+0,08 — le moteur ne dépense pas toute sa pendule),
            # donc un plafond serré TRONQUERAIT des parties que le job aurait
            # pu jouer. **Un dommage statistique réel pour réparer un problème
            # d'affichage est un mauvais échange** : le facteur 1,5 garantit
            # que c'est l'horloge du job qui décide, jamais ce nombre.
            #
            # POURQUOI L'ESTIMATION N'EST PAS CALIBRÉE, alors qu'on a des
            # points pour le faire. Les matchs réels donnaient 5,62 s/partie à
            # 8+0,08 (3738 parties) et 21,9 s à 30+0,3 (960 parties), soit un
            # facteur 0,75 contre la formule — stable sur les deux. Tentant de
            # le baker. **Mais ce facteur EST le gaspillage de pendule** : si
            # le moteur laisse une part de son horloge, ses parties finissent
            # plus vite que la cadence nominale. C21 corrige exactement cela,
            # donc la constante devait dériver vers 1 le jour où il fusionne.
            #
            # **LA PRÉDICTION EST VÉRIFIÉE, 23 sept. 2026.** Les deux matchs à
            # longueur fixe de C21 — un seul des deux moteurs porte le
            # changement — rendent 6,38 et 6,34 s/partie contre 7,47 prédites,
            # soit **0,85**, quand la même formule donnait 0,75 avec deux
            # moteurs d'avant. Le facteur a bougé exactement comme annoncé, et
            # d'un demi-pas puisqu'un seul camp a changé. Extrapolé à deux
            # moteurs C21 : (0,75 + f) / 2 = 0,85 donne f ≈ 0,95 — inférence,
            # confiance moyenne, elle suppose que la dépense d'un camp ne
            # dépend pas de l'autre alors que la LONGUEUR de la partie est
            # commune. *Une constante qu'un chantier en cours invalide ne
            # s'écrit toujours pas* : celle-ci n'a pas fini de bouger.
            #
            # **MESURÉ AVEC LES DEUX MOTEURS C21, 23 sept. 2026 : 0,97**
            # (~7,25 s/partie, C22, deux jobs coupés au plafond). 3 000
            # parties ne tiennent plus dans un job à 8+0,08 : ~2 880 au plus.
            # L'estimation de ce bloc reste CONSERVATRICE, puisque 0,97 < 1.
            plafond=$(( tient * 3 / 2 ))
            echo "::notice::Ce job atteint au moins ~$tient parties" \
                 "(estimation CONSERVATRICE de ~$s_partie s/partie, plafond de 350 min :" \
                 "les deux matchs historiques ont fait 25 % de plus). Le SPRT s'arrêtera" \
                 "avant s'il tranche ; ce nombre n'est PAS une cible."
            tools/arbiters/fastchess "${commun[@]}" -rounds $(( (plafond + 1) / 2 )) \
              -sprt elo0="${{ inputs.elo0 }}" elo1="${{ inputs.elo1 }}" \
                    alpha=0.05 beta=0.05 model=normalized \
              | tee /tmp/match.log
          fi

      # Le résumé va dans l'onglet Actions et non dans le journal : le verdict
      # du balayage par mutation avait été imprimé AVANT trois cents lignes de
      # détail, et son seul lecteur ne pouvait pas l'atteindre. Un rapport
      # qu'on ne peut pas lire ne rapporte rien.
      - name: Résumé
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          arbitre="${{ steps.refs.outputs.arbitre }}"
          tc_cand="${{ steps.refs.outputs.tc_cand }}"
          tc_ref="${{ steps.refs.outputs.tc_ref }}"
          if [ "$tc_cand" = "$tc_ref" ]; then
            cadence="\`$tc_ref\`"
          else
            cadence="candidat \`$tc_cand\` contre référence \`$tc_ref\` — **handicap de temps**"
          fi
          {
            echo "## Match — ${cadence//\`/}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| candidat | \`${{ inputs.candidat }}\` → \`${{ steps.refs.outputs.candidat }}\` |"
            echo "| référence | \`${{ inputs.reference }}\` → \`${{ steps.refs.outputs.reference }}\` |"
            echo "| cadence | $cadence |"
            echo "| graine des ouvertures | \`${{ steps.refs.outputs.graine }}\` |"
            echo "| ponder | \`${{ inputs.ponder }}\` |"
            echo "| sonde | \`${{ inputs.sonde }}\` |"
            echo "| fils de recherche | candidat ${{ steps.refs.outputs.fils_cand }}, référence ${{ steps.refs.outputs.fils_ref }} |"
            echo "| arbitre | $arbitre |"
            echo "| parties à la fois | ${{ steps.jouer.outputs.concurrence }} |"
            echo "| cœurs du runner | ${{ steps.etalon.outputs.coeurs }} |"
            echo "| topologie du runner | ${{ steps.etalon.outputs.topologie }} |"
            echo "| **nœuds/s au bench** | **${{ steps.etalon.outputs.nps }}** |"
            echo "| profondeur en 250 ms | ${{ steps.etalon.outputs.profondeur }} |"
            echo
            echo "> **La profondeur ci-dessus est le point de fonctionnement"
            echo "> réel de ce run** — les nœuds/s n'en sont qu'un indice. Deux"
            echo "> runners mesurés le 16 sept. 2026 rendaient 2 563 044 et"
            echo "> 3 139 691 n/s sur le même binaire, soit 22 % d'écart, quand"
            echo "> le conteneur de session ne varie que de 5 %. Traduit en"
            echo "> profondeur (1,36 ply par doublement de temps), cela vaut"
            echo "> environ un demi-ply."
            echo ">"
            echo "> Ce verdict est valide **en interne** quoi qu'il arrive : les"
            echo "> deux moteurs ont partagé cette machine. **Comparer ces deux"
            echo "> lignes avant de comparer ce verdict à un autre run** — c'est"
            echo "> la raison d'être de cette ligne, pas une formalité."
            echo
            echo '### Verdict'
            echo
            echo '```'
            # La dernière ligne de résultats, jamais la première : les arbitres
            # impriment un score courant après CHAQUE partie.
            if [ "$arbitre" = "fastchess" ]; then
              grep -E "^(Elo|LOS|Games|Ptnml|LLR|SPRT|Results)" /tmp/match.log \
                | tail -14 || echo "aucun résultat lisible — voir le journal"
            else
              grep -E '^Score of' /tmp/match.log | tail -1 || echo "aucun score lisible"
              grep -E '^Elo difference' /tmp/match.log | tail -1 || true
              # cutechess n'imprime AUCUN vecteur pentanomial. Reconstruit
              # depuis les « Finished game », et écrit au format de fastchess :
              # `tools/mettre-en-commun.sh` lit alors ce journal de job comme
              # un autre, sans cas particulier.
              if v=$(tools/paires.sh /tmp/match.log candidat 2>/tmp/paires.err); then
                echo "Ptnml(0-2): [${v//,/, }]"
              fi
              sed 's/^/paires.sh : /' /tmp/paires.err || true
            fi
            echo '```'
            if [ "$arbitre" = "cutechess" ]; then
              echo
              echo "> Le vecteur \`Ptnml\` ci-dessus est **reconstruit par"
              echo "> \`tools/paires.sh\`** — cutechess ne l'imprime pas. Une paire"
              echo "> incomplète est écartée, jamais comptée à moitié."
            fi
            echo
            # PERTES AU TEMPS ET ANOMALIES — SUR LE JOURNAL COMPLET.
            #
            # Ce bloc existe parce que l'API de journaux de GitHub plafonne à
            # 5000 lignes et ne sert que la FIN : une relève faite depuis une
            # session ne voyait que ~64 % d'un match de 3000 parties, et
            # écrivait « aucune perte au temps » sur une fraction. Le runner,
            # lui, a le fichier entier sous la main. **Un contrôle qui décide
            # d'une fusion ne se lit pas sur un échantillon dont on n'a pas
            # choisi la taille.**
            #
            # Le contrôle vise en premier les changements de GESTION DU TEMPS,
            # dont la perte au temps est le mode de défaillance propre : un
            # budget trop généreux ne se voit pas dans l'Elo, il se voit ici.
            echo '### Fins de partie — journal complet'
            echo
            echo '```'
            grep -oE '\{[^}]+\}' /tmp/match.log | sort | uniq -c | sort -rn \
              || echo "aucune fin de partie lisible"
            echo '```'
            # Les motifs sont ceux du SOURCE de fastchess (`match.hpp`),
            # pas des mots plausibles : TIMEOUT_MSG, ILLEGAL_MSG,
            # DISCONNECT_MSG, STALL_MSG. Un simple `stall` attraperait
            # « Installed », et `illegal` seul est trop large — éprouvé.
            # INTERRUPTED_MSG est délibérément ABSENT : un job coupé au
            # plafond de 350 min en produit, et un match à longueur fixe
            # tronqué garde une estimation non biaisée. Il reste visible dans
            # le recensement ci-dessus.
            #
            # Ceux de cutechess, qui joue le ponder, viennent de SON source
            # (`Result::description`) : il écrit les trois premiers pareil,
            # mais aussi une NULLE par temps, par déconnexion ou par blocage
            # quand l'adversaire ne peut plus mater — une perte au temps
            # quand même, que le seul motif de fastchess laisserait passer.
            anomalies=$(grep -cE \
              'loses on time|makes an illegal move|disconnects|connection stalls|Draw by (timeout|disconnection|stalled connection)' \
              /tmp/match.log || true)
            if [ "$anomalies" -gt 0 ]; then
              echo
              echo "> **$anomalies ANOMALIE(S)** — perte au temps, coup illégal"
              echo "> ou moteur perdu. **Le verdict ne vaut rien tant que ce"
              echo "> nombre n'est pas zéro** : chercher \`loses on time\` dans"
              echo "> l'artefact \`match-log\`."
            else
              echo
              echo "> Aucune perte au temps, aucun coup illégal, aucun moteur"
              echo "> perdu — **sur la totalité du journal**, pas sur sa fin."
            fi
            # LES AVERTISSEMENTS DE L'ARBITRE — une mesure, pas du bruit.
            #
            # Les deux matchs de C21 en portaient ~200, « PV continues after
            # threefold repetition » et « … after fifty-move rule », émis par
            # les DEUX moteurs. Classés bénins sans être lus, ils signalaient
            # que la recherche ne voyait pas 40 % des nulles — celles de
            # l'horizon (C22). Les compter ici les rend visibles à chaque
            # match, et dira si C22, une fois fusionné, les fait disparaître.
            echo
            echo '### Avertissements de l’arbitre — par nature et par moteur'
            echo
            echo '```'
            if [ "$arbitre" = "fastchess" ]; then
              # `.*` et non `[^-]+` : « fifty-move » porte un tiret, et la
              # première version du motif ratait exactement ces avertissements.
              grep -oE 'Warning; .* - move [^ ]+ from [^ ]+' /tmp/match.log \
                | sed -E 's/ - move [^ ]+ from / | /' | sort | uniq -c | sort -rn \
                || echo "aucun avertissement"
            else
              # Une section vide dirait « rien à signaler » ; elle dit en
              # réalité que cet arbitre ne regarde pas.
              echo "cutechess n'émet pas ces avertissements : leur absence ne dit rien"
            fi
            echo '```'
            # Le temps réel par partie, qui est ce qui dimensionne les jobs
            # suivants. Il dépend du GASPILLAGE de pendule, donc il bouge
            # quand la gestion du temps change : voir la notice de l'étape
            # « Jouer ».
            duree=$(grep -oE 'Total Time: [0-9:]+' /tmp/match.log | tail -1 \
              | grep -oE '[0-9:]+$' || true)
            parties=$(grep -oE '^Games: [0-9]+' /tmp/match.log | tail -1 \
              | grep -oE '[0-9]+$' || true)
            # cutechess n'imprime ni l'un ni l'autre : la durée se prend à la
            # pendule du job, les parties se comptent.
            if [ "$arbitre" = "cutechess" ] && [ -n "${{ steps.jouer.outputs.debut }}" ]; then
              s=$(( $(date +%s) - ${{ steps.jouer.outputs.debut }} ))
              duree=$(printf '%d:%02d:%02d' $(( s / 3600 )) $(( s % 3600 / 60 )) $(( s % 60 )))
              parties=$(grep -cE '^Finished game' /tmp/match.log || true)
            fi
            if [ -n "$duree" ] && [ -n "$parties" ] && [ "$parties" -gt 0 ]; then
              echo
              echo "| durée totale | parties | s/partie |"
              echo "|---|---|---|"
              echo "| $duree | $parties |" \
                   "$(awk -F: -v n="$parties" \
                      '{printf "%.2f", ($1*3600+$2*60+$3)/n}' <<< "$duree") |"
            fi
            # LA SONDE : les plis que chaque camp atteint, appariés par
            # partie, et les n/s des coups partis d'un `go` ordinaire. Même
            # binaire, même machine, mêmes parties : si le candidat pondère,
            # le rapport des n/s dit ce que son ponder vole à la référence,
            # sans comparer deux runners — dont la vitesse varie de 22 à 58 %.
            # Sans ponder, ce rapport est le témoin et doit valoir ~1. Il porte
            # un confondant de quelques pour cent, écrit dans `plis.sh` : il
            # sépare un cœur partagé d'une absence de vol, pas 2 % de 0 %.
            if [ "${{ inputs.sonde }}" = "oui" ]; then
              echo
              echo '### Sonde — plis et n/s, appariés par partie'
              echo
              echo '```'
              tools/plis.sh /tmp/match.log 2>&1 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # `tee` et non `>>` : le résumé du job ne s'affiche que dans
          # l'interface web, l'API de GitHub ne le sert pas. Une relève faite
          # depuis une session ne lit que le JOURNAL — et seulement sa fin,
          # 5000 lignes au plus. Ce bloc étant le dernier du job, le recopier
          # dans le journal le met exactement là où l'API le sert. Le
          # recensement des pertes au temps sur le journal ENTIER n'a de
          # valeur que s'il est lisible par qui fait la relève.

      - name: Journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-log
          path: /tmp/match.log
          retention-days: 30
