name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Moteur
    runs-on: ubuntu-latest
    # `actions: read` pour le contrôle du balayage de mutation, plus bas.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # La version vient de rust-toolchain.toml, qui la fige. `rustup show`
      # suffit à la matérialiser : rustup lit le fichier et installe ce qu'il
      # demande.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (debug)
        run: cargo test --workspace

      # Le verdict du balayage hebdomadaire par mutation est du shell, donc
      # invisible à `cargo test`. Il ne tourne qu'une fois par semaine dans le
      # workflow `Mutation` : sans ce test ici, une faute y dormirait jusqu'à ce
      # qu'elle fasse passer une régression de couverture pour un succès.
      - name: Verdict de mutation (auto-test)
        run: .github/mutation-verdict-test.sh

      # Le cliquet de mutation ne peut pas signaler sa propre absence : si
      # GitHub endort le workflow planifié — soixante jours sans activité sur
      # un dépôt public —, plus rien ne tourne et tout reste vert. Ce contrôle
      # vit ici parce que ce job tourne à chaque push, donc exactement quand le
      # code bouge. Une API injoignable ne fait qu'avertir ; seul un balayage
      # réellement arrêté fait échouer. Il remplace une routine hors dépôt qui
      # passait avant le balayage qu'elle surveillait — voir le script.
      - name: Le balayage de mutation tourne-t-il encore ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/balayage-vivant-test.sh
          api="repos/$GITHUB_REPOSITORY/actions/workflows/mutation.yml"
          if ! etat=$(gh api "$api" --jq .state) \
            || ! derniere=$(gh api "$api/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""'); then
            echo "::warning::API GitHub injoignable — contrôle du balayage de mutation sauté"
            exit 0
          fi
          tools/balayage-vivant.sh "$etat" "$derniere"

      - name: Tests (release)
        run: cargo test --workspace --release

      # Les critères d'acceptation, tous binaires. Leur nombre n'est pas écrit
      # ici : un compteur en prose naît périmé, et celui-ci a déjà changé.
      # Perft : six positions jusqu'aux profondeurs 5 et 6, 593 millions de
      # nœuds en environ deux secondes — la génération de coups passe ou non.
      # Tournoi : vingt-quatre parties entières contre un adversaire jouant au
      # hasard — une seule nulle est un échec de conversion.
      # Référence du bench : le chiffre inscrit dans CLAUDE.md est confronté à
      # celui que le binaire produit. Il a menti pendant deux jours sans que
      # rien ne s'allume ; c'est ce trou-là qui est bouché. Un changement voulu
      # de l'arbre de recherche rend donc cette étape rouge tant que CLAUDE.md
      # n'est pas mis à jour — c'est l'effet recherché, et le message d'échec
      # donne le chiffre à recopier.
      # Rustines de l'attic : la colonne « s'applique sur main ? » de
      # tools/attic/README.md est confrontée au vrai `git apply --check`. Trois
      # de ses sept lignes étaient fausses le 22 sept. 2026, toutes par la même
      # fusion, et rien ne pouvait le signaler. Ce répertoire sert à ne PAS
      # réécrire de mémoire un code déjà mesuré ; une colonne fausse y envoie.
      - name: Critères d'acceptation (perft, tournoi, référence du bench, rustines)
        run: cargo test --workspace --release -- --ignored

      # Détecteur de régression de performance. La sortie se termine par
      # `Nodes/second`, comparable d'un commit à l'autre.
      - name: Bench
        run: cargo run --release --bin shallowred -- bench 4

      # Les deux binaires que livre le dépôt (Théo, 6 oct. 2026) : celui de
      # base et l'AVX2. Ils ne sont le même moteur que s'ils cherchent le même
      # arbre — le banc fait main et les six positions au réseau, nœuds et
      # coup —, et le script refuse de les rendre sinon. Les runners ont
      # l'AVX2, donc la comparaison tourne vraiment. Son empreinte part à
      # chaque passage, pour la comparaison entre systèmes plus bas ; sur
      # `main`, les deux binaires partent en artefact : c'est la livraison.
      - name: Deux binaires, le même arbre
        run: |
          tools/binaires-test.sh
          tools/binaires.sh dist
          tar -czf shallowred-linux.tar.gz -C dist shallowred shallowred-avx2

      - name: Empreinte
        uses: actions/upload-artifact@v4
        with:
          name: empreinte-linux
          path: dist/empreinte.txt
          retention-days: 7

      - name: Livrer les deux binaires
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shallowred-linux-${{ github.sha }}
          path: shallowred-linux.tar.gz
          retention-days: 90

  # Les binaires de Windows et des deux sortes de Mac (Théo, 7 oct. 2026 :
  # « tu peux faire pour windows et macOS »). Le même script que sous Linux,
  # sur le système qui les fera tourner — un binaire ne se vérifie que là où il
  # s'exécute. Sur une PR et sur `main` seulement : quatre systèmes à chaque
  # push de chaque branche ne diraient rien de plus que la PR qui suit.
  binaires-systemes:
    name: Binaires — ${{ matrix.nom }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: windows
            os: windows-latest
          # Apple Silicon : un seul binaire, le natif.
          - nom: macos-arm64
            os: macos-latest
          # Le dernier Mac Intel des runners, maintenu jusqu'en août 2027
          # selon GitHub.
          - nom: macos-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version && cargo --version

      - name: Construire, comparer, prendre l'empreinte
        run: tools/binaires.sh dist

      - name: Empreinte
        uses: actions/upload-artifact@v4
        with:
          name: empreinte-${{ matrix.nom }}
          path: dist/empreinte.txt
          retention-days: 7

      # Une archive tar hors Windows : l'artefact est un zip, qui perd le droit
      # d'exécution. Construite à chaque passage, pour qu'une faute s'y voie
      # sur la PR plutôt que sur `main`.
      - name: Empaqueter
        if: matrix.nom != 'windows'
        run: tar -czf "shallowred-${{ matrix.nom }}.tar.gz" -C dist $(cd dist && ls shallowred*)

      - name: Livrer les binaires
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shallowred-${{ matrix.nom }}-${{ github.sha }}
          path: ${{ matrix.nom == 'windows' && 'dist/shallowred*.exe' || format('shallowred-{0}.tar.gz', matrix.nom) }}
          retention-days: 90

  # Le même raisonnement que la comparaison des deux binaires, d'un système à
  # l'autre : le code est entier, donc chaque système cherche le même arbre.
  # Un binaire qui en chercherait un autre serait un autre moteur sous le même
  # nom, et aucun match ne le verrait — les matchs ne jouent que sous Linux.
  meme-arbre-partout:
    name: Le même arbre sur chaque système
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [engine, binaires-systemes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: empreinte-*
          path: empreintes

      - name: Comparer les empreintes
        run: |
          ref=empreintes/empreinte-linux/empreinte.txt
          [ -s "$ref" ] || { echo "pas d'empreinte Linux"; exit 1; }
          n=0; echecs=0
          for f in empreintes/*/empreinte.txt; do
            n=$((n + 1))
            if diff "$ref" "$f" > /dev/null; then
              echo "ok      $(basename "$(dirname "$f")")"
            else
              echo "ÉCHEC   $(basename "$(dirname "$f")")"; diff "$ref" "$f" || true
              echecs=$((echecs + 1))
            fi
          done
          [ "$n" -eq 4 ] || { echo "$n empreintes, quatre attendues"; exit 1; }
          [ "$echecs" -eq 0 ] || exit 1
          echo "le même arbre sur les quatre systèmes : $(head -1 "$ref") nœuds au banc, et les six positions au réseau"

  # Signale les lints d'une toolchain plus récente sans jamais bloquer. Sans
  # ce job, une montée de version transformerait une pile de lints en un
  # build rouge le jour où l'on touche à rust-toolchain.toml.
  drift:
    name: Toolchain à jour (indicatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Dernière stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup run stable rustc --version

      - name: Clippy sur la dernière stable
        run: rustup run stable cargo clippy --all-targets --all-features -- -D warnings
