name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (debug)
        run: cargo test --workspace

      - name: Tests (release)
        run: cargo test --workspace --release

      # Deux critères d'acceptation, tous deux binaires.
      # Perft : six positions jusqu'aux profondeurs 5 et 6, 593 millions de
      # nœuds en environ deux secondes — la génération de coups passe ou non.
      # Tournoi : vingt-quatre parties entières contre un adversaire jouant au
      # hasard — une seule nulle est un échec de conversion.
      - name: Critères d'acceptation (perft et tournoi)
        run: cargo test --workspace --release -- --ignored

      # Détecteur de régression de performance. La sortie se termine par
      # `Nodes/second`, comparable d'un commit à l'autre.
      - name: Bench
        run: cargo run --release --bin shallowred -- bench 4
