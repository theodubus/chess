# Adaptateur maintenu : PHP, tests sous PHPUnit, mutation par Infection.
#
# Éprouvé sur un projet jetable (`bench/adapters.py`). Le `composer.json`
# du projet porte `phpunit/phpunit` et `infection/infection` ; Infection
# exige un pilote de couverture (pcov ou xdebug), et lit `infection.json5`,
# qui nomme les sources et son journal JSON (`"logs": {"json": "infection.json"}`).

language = "php"
name = "PHP (PHPUnit, Infection)"
maintained = true
sources = ["**/*.php"]

# Étapes ajoutées au workflow de CI avant le socle (indentation YAML de six).
ci_setup = """
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Dépendances
        run: composer install --no-interaction --no-progress
"""

[capabilities.format]
absent = "aucun formateur imposé ; un projet qui adopte php-cs-fixer le déclare ici"
replacement = "relecture du diff, et `lint` (`php -l` de chaque fichier)"

[capabilities.lint]
command = '''find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l > /dev/null'''
fast = true

[capabilities.build]
absent = "langage interprété : pas de compilation séparée"
replacement = "capacité `lint` (`php -l`)"

[capabilities.tests]
command = "vendor/bin/phpunit"
fast = true

[capabilities.mutation]
# Hebdomadaire, pas à chaque commit. Le journal JSON est effacé d'abord.
tool = "infection"
command = "rm -f infection.json; vendor/bin/infection --no-interaction --threads=2 || true"
modules = ["src/**/*.php"]
has_code = '\bfunction\b'
parser = "infection"

[capabilities.coverage]
absent = "signal secondaire, jamais un garde-fou"
replacement = "capacité `mutation`"

[capabilities.regression]
# Les dépendances installées, copiées dans le worktree où le test se rejoue : un
# lien ferait charger à Composer le code de l'arbre de travail.
copied = ["vendor"]
command = "vendor/bin/phpunit {test_args}"
test_arg = "{file}"
test_paths = ["tests/**/*Test.php"]
# Ce qui, dans la sortie, dit que le test ne s'est pas chargé sur le parent (une
# compilation cassée, un import manquant) : il y échoue pour une autre raison
# que le défaut corrigé.
load_error = 'PHP Parse error|Parse error:|PHP Fatal error'

[code]
paths = ["src/**/*.php", "app/**/*.php", "lib/**/*.php"]
exclude = ["tests/**", "vendor/**"]
private = '^\s*(?:(?:abstract|final|static)\s+)*(?:private|protected)\b'

[tests]
paths = ["tests/**/*.php"]
exclude = ["vendor/**"]
function = '^\s*(?:(?:public|protected|private|static|final|abstract)\s+)*function\s+(\w+)\s*\('
attribute = '^\s*(?:#\[|\*|/\*\*)'
comment = '^\s*(?://|#(?!\[))'
# Un commentaire de bloc (une docstring en Python) : un mot qui y figure
# n'appelle ni n'affirme rien.
block_comment = '''/\*[\s\S]*?\*/'''
marker_name = '^test'
marker_attribute = '#\[(?:\\?PHPUnit\\Framework\\Attributes\\)?Test\b|@test\b'
block = "braces"
strings = '''"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*\''''
line_comment = '(?://|#(?!\[)).*$'
assertion = '\$this->assert\w+\(|\b(?:self|static)::assert\w+\(|\$this->expectException\w*\(|\bfail\s*\('
ignore = '''\$this->markTest(?:Skipped|Incomplete)\b|#\[(?:\\?PHPUnit\\Framework\\Attributes\\)?Group\(\s*['"]skip'''
ignore_reason = '''markTest(?:Skipped|Incomplete)\(\s*(?:"[^"]{3,}|'[^']{3,})'''
tautology = [
  'assert(?:Same|Equals)\(\s*([^,()]+(?:\([^()]*\))?)\s*,\s*\1\s*\)',
  'assertTrue\(\s*true\s*\)',
]
