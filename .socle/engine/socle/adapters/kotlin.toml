# Adaptateur maintenu : Kotlin sous Gradle, tests kotlin.test ou JUnit 5,
# mutation par PIT (B-0095, D-0082).
#
# Éprouvé sur un projet jetable (`bench/adapters.py`). Le projet porte le
# wrapper de Gradle (`./gradlew`), le greffon `kotlin("jvm")` (ou
# `kotlin("multiplatform")`), JUnit 5 sous `useJUnitPlatform()`, et le
# greffon `info.solidsoft.pitest` avec ses rapports en XML sans horodatage
# (`outputFormats.set(listOf("XML"))`, `timestampedReports.set(false)`).
# Un projet à plusieurs modules déclare `filter { isFailOnNoMatchingTests =
# false }` dans ses tâches de test : le rejeu d'un correctif filtre par
# classe à la racine, et un module sans cette classe échouerait. Un projet
# multiplateforme ou Android, dont les tâches de Gradle ont d'autres noms
# (`testDebugUnitTest`), et dont la mutation passe par un autre greffon,
# remplace les commandes dans sa copie (`.socle/adapter.toml`).

language = "kotlin"
name = "Kotlin (Gradle, kotlin.test ou JUnit 5, PIT)"
maintained = true
sources = ["**/src/**/kotlin/**/*.kt", "**/src/**/java/**/*.kt"]

# Étapes ajoutées au workflow de CI avant le socle (indentation YAML de six).
# Le cache de Gradle exige un fichier de build : l'étape attend le premier,
# sans quoi la CI d'un projet qui n'a pas encore de Gradle échouerait avant
# tout contrôle (B-0179). Ces motifs sont une part de ceux que lit le cache.
ci_setup = """
      - uses: actions/setup-java@v5
        if: hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') != ''
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
"""

[capabilities.format]
absent = "aucun formateur imposé ; un projet qui adopte ktlint ou ktfmt le déclare ici"
replacement = "relecture du diff, et `build` (le compilateur refuse ce qui ne se lit pas)"

[capabilities.lint]
absent = "aucun linter imposé ; un projet qui adopte detekt ou ktlint le déclare ici"
replacement = "capacité `build` : le compilateur Kotlin et ses avertissements"

[capabilities.build]
command = "./gradlew -q testClasses"
fast = true

[capabilities.tests]
command = "./gradlew -q test"
fast = true

[capabilities.mutation]
# Hebdomadaire, pas à chaque commit. Le rapport `build/reports/pitest/mutations.xml`
# est réécrit à chaque balayage.
tool = "pit"
command = "./gradlew -q pitest"
modules = ["src/main/kotlin/**/*.kt", "**/src/main/kotlin/**/*.kt"]
# Une fonction qui a un corps : une interface ou un `expect` n'a rien à muter.
has_code = '\bfun\b[^\n]*\)[^\n(]*[{=]'
parser = "pit"

[capabilities.coverage]
absent = "signal secondaire, jamais un garde-fou"
replacement = "capacité `mutation`"

[capabilities.regression]
# Un test rejoué sur le commit parent : sa classe, par `--tests`, une fois
# par fichier.
command = "./gradlew -q test {test_args}"
test_arg = "--tests '*{stem}'"
test_paths = ["src/test/kotlin/**/*Test.kt", "src/test/kotlin/**/*Tests.kt", "**/src/test/kotlin/**/*Test.kt",
              "**/src/test/kotlin/**/*Tests.kt", "**/src/*Test/kotlin/**/*Test.kt", "**/src/test/java/**/*Test.kt"]
# Ce qui, dans la sortie, dit que le test ne s'est pas chargé sur le parent (une
# compilation cassée, une référence introuvable) : il y échoue pour une autre
# raison que le défaut corrigé.
load_error = 'Compilation error|Unresolved reference|e: file:'

[code]
# En Kotlin, tout est public par défaut : une fonction `private` ou
# `internal` se teste par les fonctions publiques qui l'appellent ; une
# fonction `protected` est l'interface des sous-classes, et se teste.
paths = ["src/main/kotlin/**/*.kt", "**/src/main/kotlin/**/*.kt", "**/src/*Main/kotlin/**/*.kt",
         "**/src/main/java/**/*.kt"]
exclude = ["buildSrc/**"]
private = '^(?=[^=(]*\b(?:private|internal)\b)[^=(]*\bfun\b'

[tests]
paths = ["src/test/kotlin/**/*.kt", "**/src/test/kotlin/**/*.kt", "**/src/*Test/kotlin/**/*.kt",
         "**/src/test/java/**/*.kt"]
# Une fonction : ses annotations sur la même ligne, ses modificateurs, `fun`,
# ses paramètres de type (bornés ou non), son récepteur (générique ou non),
# puis son nom, entre accents graves ou non.
function = '''^\s*(?:@[\w.]+(?:\([^)]*\))?\s+)*(?:(?:public|internal|private|protected|override|open|abstract|final|suspend|inline|operator|infix|tailrec|actual|expect|external)\s+)*fun\s+(?:<(?:[^<>]|<[^<>]*>)*>\s+)?(?:[\w.]+(?:<(?:[^<>]|<[^<>]*>)*>)?\??\.)?(\w+|`[^`]+`)\s*\('''
# Une fonction écrite en expression (`fun f(x: Int) = 2 * x`) : son corps
# commence après le `=`, au premier groupe.
expression_body = '''\)\s*(?::\s*[^={}]+?)?\s*=(?!=)\s*(.*)$'''
# Un test annoté sur la ligne même de sa fonction.
marker_line = '^\s*@(?:kotlin\.test\.|org\.junit\.jupiter\.api\.|org\.junit\.)?(?:Test|ParameterizedTest|RepeatedTest|TestFactory)\b[^\n]*\bfun\b'
attribute = '^\s*@'
comment = '^\s*(?://|/?\*)'
block_comment = '''/\*[\s\S]*?\*/'''
marker_attribute = '@(?:kotlin\.test\.|org\.junit\.jupiter\.api\.|org\.junit\.)?(?:Test|ParameterizedTest|RepeatedTest|TestFactory)\b'
block = "braces"
line_comment = '//.*$'
# Les assertions de kotlin.test et de JUnit, les vérifications de MockK et de
# Mockito (`verify`, `coVerify`), et celles de kotest (`shouldBe`).
assertion = '\bassert\w*\s*(?:<[^>]*>)?\s*[({]|\bAssertions\.\w+\(|\bfail\s*\(|\bexpect\s*\(|\b(?:co)?[vV]erify\w*\s*[({]|\bshould[A-Z]\w*\b'
ignore = '@(?:kotlin\.test\.|org\.junit\.)?Ignore\b|@(?:org\.junit\.jupiter\.api\.)?Disabled\b|\bassume(?:True|False)\s*\('
# La raison : celle de `@Disabled("…")` (JUnit 5), de `@Ignore("…")` (JUnit
# 4), ou, l'`@Ignore` de kotlin.test n'en prenant pas, un commentaire sur sa
# ligne (`@Ignore // raison`).
ignore_reason = '''@Disabled\s*\(\s*"[^"]{3,}"|@(?:org\.junit\.)?Ignore\s*\(\s*"[^"]{3,}"|@(?:kotlin\.test\.)?Ignore\b\s*//\s*\S.{2,}'''
tautology = [
  'assertEquals\(\s*([^,()]+(?:\([^()]*\))?)\s*,\s*\1\s*\)',
  'assertTrue\(\s*true\s*\)',
]
